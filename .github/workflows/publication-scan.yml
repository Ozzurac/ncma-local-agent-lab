name: Scan public export
on:
  push:
  pull_request:

jobs:
  publication-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce sanitized public export
        run: python scripts/scan_publication.py
