name: Verify synthetic benchmark evidence
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public evidence without model downloads
        run: python -m unittest discover -s tests -v
      - name: Scan public export for secrets and unapproved files
        run: python scripts/scan_publication.py
      - name: Compile portable Python modules
        run: python -m compileall -q src experiments/g3
